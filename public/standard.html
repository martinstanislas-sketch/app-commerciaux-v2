<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D9488">
  <title>Standards — Tours</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Page autonome : pas de barre d'onglets, fond identique à l'app */
    body.std-page { background: #F4F5F7; min-height: 100vh; margin: 0; }
    /* Annule les marges négatives que le CSS de l'app applique à
       #tab-standards pour compenser le padding du conteneur d'onglets
       (inexistant sur cette page autonome) */
    @media (min-width: 1100px) {
      body.std-page #tab-standards { margin: 0; }
    }

    /* Écran de connexion PIN (léger, propre à cette page) */
    .std-login-screen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .std-login-card {
      background: #fff; border-radius: 16px; padding: 32px 28px;
      width: 100%; max-width: 380px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.10);
      text-align: center;
    }
    .std-login-title { margin: 0 0 4px; font-size: 20px; color: #0F172A; }
    .std-login-sub { margin: 0 0 20px; font-size: 14px; color: #64748B; }
    .std-login-input {
      width: 100%; box-sizing: border-box;
      padding: 12px 14px; font-size: 17px; text-align: center;
      border: 1.5px solid #E2E8F0; border-radius: 10px;
      outline: none; letter-spacing: 2px;
    }
    .std-login-input:focus { border-color: #0D9488; }
    .std-login-btn {
      width: 100%; margin-top: 12px; padding: 12px;
      background: #0D9488; color: #fff; font-size: 15px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .std-login-btn:hover { background: #0B7C72; }
    .std-login-btn:disabled { opacity: .6; cursor: wait; }
    .std-login-error {
      margin-top: 12px; font-size: 13px; color: #DC2626; display: none;
    }

    /* ── En-tête compact ─────────────────────────────────── */
    .stdp-header {
      background: linear-gradient(135deg, #0F766E 0%, #14B8A6 100%);
      color: #fff;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .stdp-title {
      margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25;
      letter-spacing: .01em;
      /* Neutralise le dégradé texte appliqué globalement à « header h1 » */
      background: none; -webkit-background-clip: initial; background-clip: initial;
      color: #fff; -webkit-text-fill-color: #fff;
      white-space: normal;
    }
    .stdp-studio { text-transform: uppercase; letter-spacing: .05em; }
    .stdp-sub {
      display: flex; align-items: center; gap: 6px;
      margin-top: 2px; font-size: 13px; color: rgba(255, 255, 255, 0.9);
    }
    .stdp-nav {
      background: rgba(255, 255, 255, 0.15); color: #fff;
      border: none; border-radius: 6px;
      width: 22px; height: 22px; line-height: 1;
      font-size: 14px; cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .stdp-nav:hover { background: rgba(255, 255, 255, 0.28); }
    .stdp-sep { opacity: .7; }
    .stdp-count { font-weight: 600; }
    .stdp-head-actions { display: flex; align-items: center; gap: 10px; }
    /* Raccourci « Suivant » compact */
    .stdp-next {
      display: inline-flex; align-items: center; gap: 8px;
      background: #0F172A; color: #fff;
      border: none; border-radius: 10px;
      padding: 8px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .stdp-next:hover { background: #1E293B; }
    .stdp-next-label {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; opacity: .65;
    }
    .stdp-done {
      font-size: 13px; font-weight: 700; color: #fff;
      background: rgba(255, 255, 255, 0.18);
      padding: 7px 12px; border-radius: 10px; white-space: nowrap;
    }
    .std-logout-btn {
      padding: 7px 14px; font-size: 13px;
      background: rgba(255, 255, 255, 0.12); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    .std-logout-btn:hover { background: rgba(255, 255, 255, 0.24); }

    /* Titre de la prise de poste affichée */
    .std-group-head {
      font-size: 13px; font-weight: 700; color: #0F766E;
      text-transform: uppercase; letter-spacing: .06em;
      margin: 4px 2px 10px;
    }
    .std-group-head-ro { color: #94A3B8; font-weight: 600; }
    /* Bouton final « Valider ma prise de poste » */
    .std-validate-wrap {
      margin: 14px 0 4px;
      display: flex; justify-content: center;
    }
    .std-validate-btn {
      width: 100%; max-width: 420px;
      padding: 14px 20px; font-size: 15px; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      background: #0D9488; color: #fff;
      transition: background .15s;
    }
    .std-validate-btn:hover { background: #0B7C72; }
    .std-validate-btn:disabled {
      background: #E2E8F0; color: #64748B; cursor: not-allowed;
    }
    .std-validated-chip {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; max-width: 420px;
      background: #ECFDF5; border: 1px solid #A7F3D0; color: #047857;
      font-weight: 600; font-size: 14px;
      padding: 12px 18px; border-radius: 12px;
    }
    .std-novalid-note {
      color: #94A3B8; font-size: 13px; text-align: center; padding: 8px;
    }
    /* Bouton « Voir les contrôles précédents » */
    .std-prev-toggle {
      display: block; margin: 18px auto 6px; padding: 10px 20px;
      background: #fff; border: 1px solid #E2E8F0; border-radius: 10px;
      color: #475569; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .std-prev-toggle:hover { background: #F8FAFC; color: #0F172A; }
    .std-prev-wrap { margin-top: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="std-page">

  <!-- Connexion PIN -->
  <div id="std-login" class="std-login-screen hidden">
    <form id="std-login-form" class="std-login-card" autocomplete="off">
      <h1 class="std-login-title">Standards — Tours</h1>
      <p class="std-login-sub">Entre ton code PIN pour accéder aux photos du jour</p>
      <input type="password" id="std-login-pin" class="std-login-input" inputmode="text" placeholder="Code PIN" required minlength="3" autofocus>
      <button type="submit" id="std-login-submit" class="std-login-btn">Se connecter</button>
      <div id="std-login-error" class="std-login-error"></div>
    </form>
  </div>

  <!-- Page Standards (id #tab-standards conservé pour réutiliser le CSS existant) -->
  <section id="tab-standards" class="tab-content active hidden">
    <header class="stdp-header">
      <div class="stdp-head-main">
        <h1 class="stdp-title">Prise de poste — <span class="stdp-studio" id="std-studio-name">Tours</span></h1>
        <div class="stdp-sub">
          <button type="button" class="stdp-nav" id="std-month-prev" aria-label="Jour précédent">‹</button>
          <span class="stdp-date" id="std-month-label">—</span>
          <button type="button" class="stdp-nav" id="std-month-next" aria-label="Jour suivant">›</button>
          <span class="stdp-sep">·</span>
          <span class="stdp-count" id="std-progress-inline">—</span>
        </div>
      </div>
      <div class="stdp-head-actions">
        <div id="std-score-display"></div>
        <button type="button" class="std-logout-btn" id="std-logout">Sortir</button>
      </div>
    </header>
    <div class="std-wrap">
      <div id="std-categories" class="std-categories"></div>
    </div>
  </section>

  <script src="/standard.js"></script>
</body>
</html>
