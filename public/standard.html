<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E293B">
  <title>Standards — Prise de poste</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ═══════════════════════════════════════════════════════════
       Thème « premium » de la page /standard
       - Bleu nuit  (#0F172A / #1E293B) : titres, textes importants,
         boutons principaux
       - Bleu électrique (#2563EB) : accent d'identité + validé
       - Fond gris très clair, cartes blanches
       - Orange = à faire, Rouge = anomalies
       ═══════════════════════════════════════════════════════════ */
    body.std-page { background: #F6F7F9; min-height: 100vh; margin: 0; }
    /* Annule les marges négatives + min-height hérités du CSS de l'app */
    @media (min-width: 1100px) {
      body.std-page #tab-standards { margin: 0; }
    }
    body.std-page #tab-standards { min-height: 0; background: transparent; }

    /* ── Écran de connexion PIN ─────────────────────────────── */
    .std-login-screen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .std-login-card {
      background: #fff; border-radius: 16px; padding: 32px 28px;
      width: 100%; max-width: 380px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .std-login-title { margin: 0 0 4px; font-size: 20px; color: #0F172A; }
    .std-login-sub { margin: 0 0 20px; font-size: 14px; color: #64748B; }
    .std-login-input {
      width: 100%; box-sizing: border-box;
      padding: 12px 14px; font-size: 17px; text-align: center;
      border: 1.5px solid #E2E8F0; border-radius: 10px;
      outline: none; letter-spacing: 2px;
    }
    .std-login-input:focus { border-color: #2563EB; }
    .std-login-btn {
      width: 100%; margin-top: 12px; padding: 12px;
      background: #1E293B; color: #fff; font-size: 15px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .std-login-btn:hover { background: #0F172A; }
    .std-login-btn:disabled { opacity: .6; cursor: wait; }
    .std-login-error {
      margin-top: 12px; font-size: 13px; color: #DC2626; display: none;
    }

    /* ── En-tête compact (blanc, texte bleu nuit) ───────────── */
    .stdp-header {
      background: #fff;
      border-bottom: 1px solid #E2E8F0;
      color: #0F172A;
      padding: 8px 20px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .stdp-title {
      margin: 0; font-size: 16px; font-weight: 700; line-height: 1.25;
      letter-spacing: .01em;
      background: none; -webkit-background-clip: initial; background-clip: initial;
      color: #0F172A; -webkit-text-fill-color: #0F172A;
      white-space: normal;
    }
    /* Accent d'identité : bleu électrique, uniquement sur le studio */
    .stdp-studio { color: #2563EB; -webkit-text-fill-color: #2563EB; text-transform: uppercase; letter-spacing: .05em; }
    /* Sélecteur de studio (admin / superviseurs) : même look que le texte */
    .stdp-studio-select {
      appearance: auto;
      font: inherit; font-weight: 700;
      color: #2563EB; -webkit-text-fill-color: #2563EB;
      text-transform: uppercase; letter-spacing: .05em;
      background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 8px;
      padding: 1px 6px; cursor: pointer;
    }
    .stdp-studio-select:hover { background: #DBEAFE; }
    .stdp-sub {
      display: flex; align-items: center; gap: 6px;
      margin-top: 1px; font-size: 12.5px; color: #64748B;
    }
    .stdp-nav {
      background: #F1F5F9; color: #334155;
      border: none; border-radius: 6px;
      width: 21px; height: 21px; line-height: 1;
      font-size: 13px; cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .stdp-nav:hover { background: #E2E8F0; }
    .stdp-sep { opacity: .7; }
    .stdp-count { font-weight: 600; color: #0F172A; }
    .stdp-head-actions { display: flex; align-items: center; gap: 10px; }
    /* Raccourci « Suivant » : bouton principal bleu nuit */
    .stdp-next {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1E293B; color: #fff;
      border: none; border-radius: 9px;
      padding: 7px 13px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .stdp-next:hover { background: #0F172A; }
    .stdp-next-label {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; opacity: .6;
    }
    /* 6/6 photos, pas encore validé */
    .stdp-done {
      font-size: 12.5px; font-weight: 700; color: #B45309;
      background: #FEF3C7; border: 1px solid #FDE68A;
      padding: 6px 11px; border-radius: 9px; white-space: nowrap;
    }
    /* Statut discret une fois validé (bleu électrique = terminé) */
    .stdp-done-mini {
      font-size: 13px; font-weight: 600;
      color: #2563EB; white-space: nowrap;
    }
    .std-logout-btn {
      padding: 6px 13px; font-size: 12.5px;
      background: #fff; color: #475569;
      border: 1px solid #CBD5E1;
      border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    .std-logout-btn:hover { background: #F8FAFC; color: #0F172A; }

    /* ── Bandeaux de section (fins, accent bleu) ────────────── */
    body.std-page #tab-standards .std-group-head {
      background: #fff; color: #0F172A;
      border: 1px solid #E2E8F0; border-left: 3px solid #2563EB;
      border-radius: 8px;
      padding: 4px 12px; margin-bottom: 8px;
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .std-group-head-ro { color: #94A3B8; font-weight: 600; }
    /* Barre de rangée cliquable (repli/dépli) */
    body.std-page #tab-standards .std-group-head-btn {
      width: 100%; box-sizing: border-box; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-family: inherit; text-align: left;
    }
    body.std-page #tab-standards .std-group-head-btn:hover { background: #F8FAFC; }
    .std-group-head-right {
      display: inline-flex; align-items: center; gap: 8px;
      text-transform: none; letter-spacing: normal; flex-shrink: 0;
    }
    .std-group-head-status { font-size: 12px; font-weight: 600; color: #64748B; }
    .std-group-head-status-ok { color: #2563EB; }
    .std-collapse-caret { color: #94A3B8; font-size: 13px; }

    /* ── Carte « Suivant » et états : teal de l'app → bleu ──── */
    body.std-page #tab-standards .std-card.std-card-next {
      border-color: #2563EB;
      box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.30), 0 0 0 1px rgba(37, 99, 235, 0.18);
    }
    body.std-page #tab-standards .std-card-next .std-card-icon {
      background: #EFF6FF; color: #1D4ED8;
    }
    body.std-page #tab-standards .std-card-next-tag {
      background: #2563EB;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
    }
    body.std-page #tab-standards .std-card-pulse { border-color: #2563EB; }
    /* Redéfinit l'animation de pulsation (ombre teal → bleue) */
    @keyframes stdCardPulse {
      0%, 100% { transform: translateY(0); box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.04); }
      50% { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(37, 99, 235, 0.28); }
    }
    body.std-page #tab-standards .std-card-uploading::after {
      background: linear-gradient(90deg, transparent 0%, rgba(37, 99, 235, 0.18) 50%, transparent 100%);
      background-size: 200% 100%;
    }

    /* ── Cartes ─────────────────────────────────────────────── */
    /* Bordure neutre (le bleu électrique est réservé à la coche de validation) */
    body.std-page #tab-standards .std-card { border-color: #E2E8F0; }
    body.std-page #tab-standards .std-card-filled { border-color: #E2E8F0; }
    body.std-page #tab-standards .std-card:hover { border-color: #CBD5E1; }
    /* Corps de carte remplie : 2 lignes seulement */
    body.std-page #tab-standards .stdp-card-body {
      padding: 6px 9px 7px; gap: 3px;
      display: flex; flex-direction: column;
    }
    .stdp-card-row1 {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      min-width: 0;
    }
    body.std-page #tab-standards .std-card-title {
      font-size: 12.5px; font-weight: 700; color: #0F172A; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Petite coche bleu électrique de validation (remplace le badge « Validée ») */
    .stdp-check {
      flex-shrink: 0;
      width: 17px; height: 17px; border-radius: 50%;
      background: #EFF6FF; border: 1px solid #BFDBFE; color: #2563EB;
      font-size: 11px; font-weight: 800; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .stdp-card-row2 {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      min-width: 0;
    }
    .stdp-card-meta {
      font-size: 11px; color: #64748B;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stdp-card-actions { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    /* Petit bouton « Reprendre » discret */
    .stdp-retake {
      display: inline-flex; align-items: center; gap: 4px;
      background: #fff; color: #334155;
      border: 1px solid #E2E8F0; border-radius: 6px;
      padding: 2px 7px; font-size: 11px; font-weight: 600;
      cursor: pointer;
    }
    .stdp-retake:hover { background: #F8FAFC; color: #0F172A; }
    .stdp-retake svg { width: 11px; height: 11px; }
    /* Poubelle (admin) : volontairement effacée, rouge seulement au survol */
    .stdp-del {
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: none; padding: 2px; cursor: pointer;
      color: #CBD5E1;
    }
    .stdp-del:hover { color: #DC2626; }
    .stdp-del svg { width: 12px; height: 12px; }

    /* ── Bouton final de validation ─────────────────────────── */
    .std-validate-wrap {
      margin: 8px 0 0;
      display: flex; justify-content: center;
    }
    /* Bouton principal bleu nuit */
    .std-validate-btn {
      width: 100%; max-width: 400px;
      padding: 8px 18px; font-size: 13px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      background: #1E293B; color: #fff;
      transition: background .15s;
    }
    .std-validate-btn:hover { background: #0F172A; }
    .std-validate-btn:disabled {
      background: #E2E8F0; color: #64748B; cursor: not-allowed;
    }
    /* Confirmation unique du créneau terminé (bleu électrique) */
    .std-validated-chip {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; max-width: 400px;
      background: #EFF6FF; border: 1px solid #BFDBFE; color: #1D4ED8;
      font-weight: 600; font-size: 12.5px;
      padding: 7px 14px; border-radius: 10px;
    }
    .std-novalid-note {
      color: #94A3B8; font-size: 12px; text-align: center; padding: 3px;
    }

    /* ── Densité desktop : Matin + Après-midi sur UN écran ──── */
    @media (min-width: 721px) {
      body.std-page #tab-standards .std-wrap { padding: 12px 24px 16px; }
      body.std-page #tab-standards .std-group { margin-bottom: 10px; }
      body.std-page #tab-standards .std-slots-grid { gap: 10px; }
      /* Photos aussi hautes que possible SANS dépasser un écran :
         hauteur pilotée par la fenêtre, partagée entre les 2 rangées */
      body.std-page #tab-standards .std-card-photo {
        aspect-ratio: auto;
        height: clamp(84px, calc((100vh - 450px) / 2), 170px);
      }
      body.std-page #tab-standards .std-card-empty-body { padding: 9px; gap: 7px; }
      body.std-page #tab-standards .std-card-primary { padding: 7px 10px; font-size: 12.5px; }
      body.std-page #tab-standards .std-card-primary svg { width: 14px; height: 14px; }
      body.std-page #tab-standards .std-card-readonly-note { padding: 4px 0; margin: 0; }
      body.std-page #tab-standards .std-card-icon { width: 24px; height: 24px; }
      body.std-page #tab-standards .std-card-icon svg { width: 13px; height: 13px; }
    }
    /* Grille : 6 vignettes sur une seule ligne en desktop */
    body.std-page #tab-standards .std-slots-grid {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 1000px) and (min-width: 721px) {
      body.std-page #tab-standards .std-slots-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      body.std-page #tab-standards .std-slots-grid { grid-template-columns: 1fr; gap: 8px; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="std-page">

  <!-- Connexion PIN -->
  <div id="std-login" class="std-login-screen hidden">
    <form id="std-login-form" class="std-login-card" autocomplete="off">
      <h1 class="std-login-title">Standards — Prise de poste</h1>
      <p class="std-login-sub">Entre ton code PIN pour accéder aux photos du jour</p>
      <input type="password" id="std-login-pin" class="std-login-input" inputmode="text" placeholder="Code PIN" required minlength="3" autofocus>
      <button type="submit" id="std-login-submit" class="std-login-btn">Se connecter</button>
      <div id="std-login-error" class="std-login-error"></div>
    </form>
  </div>

  <!-- Page Standards (id #tab-standards conservé pour réutiliser le CSS existant) -->
  <section id="tab-standards" class="tab-content active hidden">
    <header class="stdp-header">
      <div class="stdp-head-main">
        <h1 class="stdp-title">Prise de poste — <span class="stdp-studio" id="std-studio-name">Tours</span></h1>
        <div class="stdp-sub">
          <button type="button" class="stdp-nav" id="std-month-prev" aria-label="Jour précédent">‹</button>
          <span class="stdp-date" id="std-month-label">—</span>
          <button type="button" class="stdp-nav" id="std-month-next" aria-label="Jour suivant">›</button>
          <span class="stdp-sep">·</span>
          <span class="stdp-count" id="std-progress-inline">—</span>
        </div>
      </div>
      <div class="stdp-head-actions">
        <div id="std-score-display"></div>
        <button type="button" class="std-logout-btn" id="std-logout">Sortir</button>
      </div>
    </header>
    <div class="std-wrap">
      <div id="std-categories" class="std-categories"></div>
    </div>
  </section>

  <script src="/standard.js"></script>
</body>
</html>
